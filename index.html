<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tardigrade Catalogue</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #263238;
            background-color: #f7f8f7;
        }

        header {
            background-color: #ffffff;
            border-bottom: 1px solid #d9dddd;
            padding: 0 8%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #263238;
            text-decoration: none;
        }

        nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #546266;
            font-size: 15px;
        }

        nav a:hover {
            color: #1f6f5b;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 90px 30px 100px;
        }

        .intro {
            text-align: center;
            margin-bottom: 60px;
        }

        .intro h1 {
            font-size: 42px;
            font-weight: 500;
            margin: 0 0 15px;
            color: #263238;
        }

        .intro p {
            font-size: 18px;
            color: #687477;
            margin: 0;
        }

        .search-box {
            max-width: 650px;
            margin: 35px auto 0;
            display: flex;
        }

        .search-box input {
            flex: 1;
            padding: 16px 18px;
            border: 1px solid #cbd2d0;
            border-radius: 5px 0 0 5px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .search-box input:focus {
            border-color: #669b8a;
        }

        .search-box button {
            padding: 0 25px;
            border: none;
            border-radius: 0 5px 5px 0;
            background-color: #2f7662;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: #255f4f;
        }

        .browse {
            background: white;
            border: 1px solid #d9dddd;
            border-radius: 6px;
            padding: 35px 40px;
        }

        .browse h2 {
            margin-top: 0;
            font-size: 22px;
            font-weight: 500;
        }

        .browse p {
            color: #687477;
            line-height: 1.6;
        }

        .browse-link {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 18px;
            background-color: #2f7662;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .browse-link:hover {
            background-color: #255f4f;
        }

        footer {
            border-top: 1px solid #d9dddd;
            background-color: #ffffff;
            padding: 25px 8%;
            color: #7a8587;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 20px;
            }

            nav a {
                margin-left: 12px;
            }

            main {
                padding: 60px 20px;
            }

            .intro h1 {
                font-size: 32px;
            }

            .search-box {
                display: block;
            }

            .search-box input {
                width: 100%;
                border-radius: 5px;
            }

            .search-box button {
                width: 100%;
                padding: 14px;
                margin-top: 8px;
                border-radius: 5px;
            }

            .browse {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">Tardigrade Catalogue</a>

    <nav>
        <a href="#">Browse</a>
        <a href="#">About</a>
    </nav>
</header>

<main>

    <section class="intro">
        <h1>Tardigrade Catalogue</h1>

        <p>
            An open taxonomic catalogue of Tardigrada
        </p>

        <div class="search-box">
            <input
                type="text"
                placeholder="Search species, genus, family, or synonym..."
            >

            <button>Search</button>
        </div>
    </section>


    <section class="browse">

        <h2>Browse Tardigrada</h2>

        <p>
            Explore the taxonomy of tardigrades, from the phylum
            Tardigrada to individual species.
        </p>

        <a href="#" class="browse-link">
            Explore the taxonomy →
        </a>

    </section>

</main>

<footer>
    Tardigrade Catalogue · An annually developing taxonomic resource
</footer>

</body>
</html>
